steps:
  - task: DownloadSecureFile@1
    name: sshKey
    displayName: Download SSH private key from Secure Files
    inputs:
      secureFile: 'epicbook_rsa'

  - script: chmod 600 "$(sshKey.secureFilePath)"
    displayName: Restrict permissions on the temporary key

  - script: |
      set -e
      VENV="$(Pipeline.Workspace)/ansible-venv"
      if [ ! -x "$VENV/bin/ansible-playbook" ]; then
        python3 -m venv "$VENV"
        "$VENV/bin/pip" install --quiet --upgrade pip
        "$VENV/bin/pip" install --quiet "ansible-core~=2.17.0"
      fi
      echo "##vso[task.prependpath]$VENV/bin"
    displayName: Install or verify Ansible