---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Create the EpicBook reverse-proxy site from a template
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable the EpicBook site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook.conf
    dest: /etc/nginx/sites-enabled/epicbook.conf
    state: link
  notify: Reload Nginx

- name: Test the Nginx configuration before any reload
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true