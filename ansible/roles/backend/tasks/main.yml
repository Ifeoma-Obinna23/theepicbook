---
- name: Install Git (backend only)
  ansible.builtin.apt:
    name: git
    state: present

- name: Create the EpicBook service account (no login shell)
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure the APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add the NodeSource repository for Node.js LTS
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true

- name: Install Node.js (includes npm)
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Create the application parent directory
  ansible.builtin.file:
    path: /opt/epicbook
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy or update the EpicBook code
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
  register: app_code
  notify: Restart EpicBook

- name: Keep the generated config.json out of Git's change tracking
  ansible.builtin.command: git update-index --skip-worktree config/config.json
  args:
    chdir: "{{ app_dir }}"
  changed_when: false

- name: Check whether dependencies are installed
  ansible.builtin.stat:
    path: "{{ app_dir }}/node_modules"
  register: node_modules

- name: Install dependencies from the lock file
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: "{{ app_dir }}"
  when: app_code.changed or not node_modules.stat.exists
  notify: Restart EpicBook

- name: Create the protected EpicBook config directory
  ansible.builtin.file:
    path: /etc/epicbook
    state: directory
    owner: root
    group: "{{ app_user }}"
    mode: "0750"

- name: Write the database configuration (protected, secret hidden)
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ app_dir }}/config/config.json"
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  no_log: true
  notify: Restart EpicBook

- name: Install the EpicBook systemd service
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart EpicBook